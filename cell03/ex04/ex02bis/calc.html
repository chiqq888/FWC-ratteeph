<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - jQuery</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <form id="calculator">
        <input type="text" id="leftNumber" placeholder="First number">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="rightNumber" placeholder="Second number">
        <input type="submit" value="Try me!">
    </form>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="calc.js"></script>
</body>
</html>
