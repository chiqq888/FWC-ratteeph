<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* ล็อกสัดส่วนช่องให้หด-ขยายอย่างสมดุล */
        }
        td {
            border: 1px solid black;
            width: 50%;
            padding: 10px;
            vertical-align: middle;
            word-break: break-word; /* ป้องกันข้อความยาวดันตารางล้นจอเมื่อย่อหน้าต่าง */
        }
        .first-cell {
            background-color: #b8c477;
        }
        .second-cell {
            background-color: #f7bfab;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>
</body>
</html>
