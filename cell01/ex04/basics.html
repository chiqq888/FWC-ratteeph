<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }
        .title {
            text-align: center;
            color: white;
        }
        .container {
            display: flex;             
            justify-content: center;    
            gap: 30px;                  
        }
        .shop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .shop-item img {
            width: 200px;
            height: 120px;
            object-fit: contain;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
        }
        .shop-item a {
            margin-top: 8px;
        }
        .footer {
            text-align: right;        
            font-style: italic;        
            font-family: monospace;    
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>Online Shops @KMITL</h1>
    </div>

    <div class="container">
        <div class="shop-item">
            <a href="https://www.amazon.com/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            </a>
            <a href="https://www.amazon.com/" target="_blank">Amazon</a>
        </div>
        <div class="shop-item">
            <a href="https://www.ebay.com/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay">
            </a>
            <a href="https://www.ebay.com/" target="_blank">eBay</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        <p>© ratteeph 2026</p>
    </div>
</body>
</html>
