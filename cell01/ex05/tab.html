<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }
        td {
            border: 1px solid black;
            height: 150px;
            padding: 10px;
            vertical-align: middle;
            width: 50%;
        }
        .first-cell {
            background-color: #b8c477;
        }
        .second-cell {
            background-color: #f7bfab;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>
</body>
</html>
